<!doctype html>
<html lang="en" data-page="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="viewport.js?v=93"></script>
  <title>DRIVE AGENT</title>
  <meta name="description" content="Explore the DRIVE AGENT demo. Accounting, PPC and actions in one workspace.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="DRIVE AGENT">
  <meta property="og:description" content="Open the interactive demo. Explore accounting, PPC and actions.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="drive-agent-logo.png">
  <link rel="stylesheet" href="styles.css?v=113">
  <link rel="stylesheet" href="chat.css?v=115">
  <link rel="stylesheet" href="workspaces.css?v=108">
  <link rel="stylesheet" href="pure-colors.css?v=107">
  <link rel="stylesheet" href="ppc-layout.css?v=98">
  <link rel="stylesheet" href="clean-chrome.css?v=84">
  <link rel="stylesheet" href="sheet-menus.css?v=114">
  <link rel="stylesheet" href="home.css?v=112">
  <link rel="stylesheet" href="ui-type.css?v=106">
  <link rel="stylesheet" href="chrome-viewport.css?v=110">
  <script src="chrome-viewport.mjs?v=110" type="module"></script>
</head>
<body class="home-mode has-workspace-menu has-inline-sheet-menus">
  <!-- Threshold only the brand logo, never the product photos or data colors. -->
  <svg class="color-filter-definitions" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="logo-pure-bw" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0 1"/>
          <feFuncG type="discrete" tableValues="0 1"/>
          <feFuncB type="discrete" tableValues="0 1"/>
          <feFuncA type="identity"/>
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>
  <div class="workbook-shell">
    <header class="brand-header" aria-label="DRIVE AGENT main navigation">
      <button id="header-menu" class="header-button" type="button" data-mobile-menu="settings" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu-backdrop">
        <span class="desktop-header-content">MENU</span>
        <svg class="mobile-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a id="header-home" class="header-button header-logo" href="./" aria-label="DRIVE AGENT — homepage">
        <img class="drive-header-wordmark" src="drive-agent-logo.png" alt="DRIVE AGENT" width="2172" height="724" fetchpriority="high">
      </a>
      <button id="header-login" class="header-button" type="button" data-mobile-menu="login" aria-label="Login" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu-backdrop">
        <span class="desktop-header-content">LOGIN</span>
        <svg class="mobile-header-icon header-person" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0Z"/></svg>
      </button>
    </header>
    <main id="home-page" class="home-page" tabindex="-1">
      <a class="demo-primary" href="./demo.html?workspace=targets"><h1>ENTER DEMO</h1></a>
    </main>
    <div id="menu-backdrop" class="menu-backdrop" role="presentation" hidden>
      <aside class="period-menu" role="dialog" aria-modal="true" aria-labelledby="period-menu-title">
        <div class="period-menu-header">
          <div><span class="menu-brand">DRIVE AGENT</span><h2 id="period-menu-title">Login</h2></div>
          <div class="menu-header-actions"><button id="menu-back" class="menu-back" type="button" hidden>Back</button><button id="menu-close" class="menu-close" type="button" aria-label="Close menu">×</button></div>
        </div>
        <div class="period-menu-body">
          <section class="menu-section" data-menu-section="login">
            <div class="login-notice"><h3>Account login is not connected yet</h3><p>This public version does not require an account. You can continue exploring the demo.</p></div>
          </section>
        </div>
        <div class="menu-footer"><button id="apply-view" class="apply-view-button" type="button">Back to homepage</button></div>
      </aside>
    </div>
    <div id="chat-widget" class="chat-widget">
      <section id="chat-popup" class="chat-popup" role="dialog" aria-modal="false" aria-labelledby="chat-title" aria-describedby="chat-notice" tabindex="-1" hidden>
        <header class="chat-topbar">
          <button id="chat-rooms-toggle" class="chat-icon" type="button" aria-label="Show conversation list" aria-controls="chat-rooms" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="chat-list-icon" d="M4 5h16M4 12h16M4 19h16"/><path class="chat-back-icon" d="m14 5-7 7 7 7"/></svg></button>
          <div class="chat-heading"><h2 id="chat-title">MAIN CHAT</h2><span id="chat-notice">LOCAL DEMO</span></div>
          <button id="chat-close" class="chat-icon" type="button" aria-label="Close chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </header>
        <nav id="chat-rooms" aria-label="Started conversations" hidden></nav>
        <div id="chat-conversation">
          <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Main chat messages"></div>
          <p id="chat-status" class="chat-sr-only" role="status" aria-live="polite"></p>
          <form id="chat-form" class="chat-composer"><label class="chat-sr-only" for="chat-input">Message</label><textarea id="chat-input" rows="1" maxlength="2000" placeholder="MESSAGE" aria-describedby="chat-notice"></textarea><button id="chat-submit" class="chat-send" type="submit" aria-label="Send demo message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-7 7 7-7 7 7"/></svg></button></form>
        </div>
      </section>
      <button id="chat-launcher" class="chat-launcher" type="button" aria-label="Open main chat" aria-haspopup="dialog" aria-controls="chat-popup" aria-expanded="false">
        <svg class="chat-dots" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/></svg>
      </button>
    </div>
  </div>
  <script src="home.js?v=112" type="module"></script>
  <script src="chat.js?v=115" type="module"></script>
  <script src="viewport-diagnostics.mjs?v=110" type="module"></script>
</body>
</html>
